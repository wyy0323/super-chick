<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#149FE8" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no,email=no,address=no" />
<title>超级小鸡 · Super Chick</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="game" id="game">
  <canvas id="stage" aria-label="超级小鸡游戏画面"></canvas>

  <!-- 顶部信息层 -->
  <div class="hud">
    <div class="chip chick-chip" id="chickChip" title="队伍数量">
      <svg class="mascot" viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="15" cy="19" rx="11" ry="9.5" fill="#FFD93D" stroke="#E8A400" stroke-width="1.5" />
        <circle cx="9.5" cy="10" r="2.6" fill="#FF5A5F" />
        <circle cx="15" cy="8.2" r="3" fill="#FF5A5F" />
        <circle cx="20.5" cy="10" r="2.6" fill="#FF5A5F" />
        <circle cx="20" cy="17" r="1.9" fill="#22343F" />
        <circle cx="20.7" cy="16.3" r="0.7" fill="#FFFFFF" />
        <path d="M24 20l6.5 2.2L24 24.5z" fill="#FF9F1C" />
      </svg>
      <span class="chip-x">×</span><span id="chickCount">3</span>
    </div>

    <div class="score-chip" id="scoreChip" aria-live="polite">
      <span id="score">0</span>
    </div>

    <div class="hud-right">
      <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭音效" aria-pressed="true">
        <svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4z" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
        </svg>
        <svg class="ico ico-off hidden" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6 9H2v6h4l5 4z" />
          <path d="m22 9-6 6" />
          <path d="m16 9 6 6" />
        </svg>
      </button>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停">
        <svg class="ico ico-pause" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16" rx="1" />
          <rect x="14" y="4" width="4" height="16" rx="1" />
        </svg>
        <svg class="ico ico-play hidden ico-fill" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast">拖动摇杆或屏幕，带鸡群去吃蛋</div>

  <!-- 虚拟摇杆（游戏中显示） -->
  <div class="joystick hidden" id="joystick" role="group" aria-label="虚拟摇杆">
    <div class="joy-knob" id="joyKnob">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <ellipse cx="16" cy="18" rx="11.5" ry="9.5" fill="#FFD93D" stroke="#E8A400" stroke-width="1.6" />
        <circle cx="10.2" cy="9" r="2.6" fill="#FF5A5F" />
        <circle cx="16" cy="7.4" r="3" fill="#FF5A5F" />
        <circle cx="21.8" cy="9" r="2.6" fill="#FF5A5F" />
        <circle cx="20.6" cy="16.6" r="1.9" fill="#22343F" />
        <circle cx="21.3" cy="15.9" r="0.7" fill="#FFFFFF" />
        <path d="M24.5 19.4l6.5 2.3-6.5 2.3z" fill="#FF9F1C" />
      </svg>
    </div>
  </div>

  <!-- 开始界面 -->
  <div class="overlay" id="startScreen">
    <div class="panel">
      <p class="eyebrow">一只鸡 · 一整个队伍</p>
      <h1 class="title">超级小鸡</h1>
      <p class="subtitle">吃鸡蛋，孵小鸡，别让老鹰把队伍叼空。</p>

      <ul class="rules">
        <li>
          <span class="rule-ico">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 7.07 17 2.51-7.39L21 11.07z" /></svg>
          </span>
          <div class="rule-text">
            <b>推摇杆</b>
            <span>左下角摇杆、鼠标、手指都能带路</span>
          </div>
        </li>
        <li>
          <span class="rule-ico">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c3.4 0 6 4.8 6 9a6 6 0 0 1-12 0c0-4.2 2.6-9 6-9z" /></svg>
          </span>
          <div class="rule-text">
            <b>吃鸡蛋</b>
            <span>每颗蛋孵出一只小鸡，+10 分</span>
          </div>
        </li>
        <li>
          <span class="rule-ico">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M21.73 18 13.73 4a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
              <path d="M12 9v4" /><path d="M12 17h.01" />
            </svg>
          </span>
          <div class="rule-text">
            <b>躲老鹰</b>
            <span>被叼一只少一只，只剩老大就结束</span>
          </div>
        </li>
      </ul>

      <button class="btn btn-primary" id="startBtn" type="button">
        <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
        开始冒险
      </button>
      <p class="best-line">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
          <path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
          <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
          <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
        </svg>
        最高分 <b id="bestStart">0</b>
      </p>
    </div>
  </div>

  <!-- 结束界面 -->
  <div class="overlay hidden" id="overScreen">
    <div class="panel">
      <p class="eyebrow">队伍被叼空了</p>
      <h2 class="panel-title">老大被叼走了！</h2>
      <p class="subtitle">把队伍拉长一点，老鹰就追不上你了。</p>
      <div class="result">
        <div class="result-item"><span>本局得分</span><b id="finalScore">0</b></div>
        <div class="result-item"><span>最高分</span><b id="bestScore">0</b></div>
      </div>
      <button class="btn btn-primary" id="againBtn" type="button">
        <svg class="btn-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" /></svg>
        再来一局
      </button>
      <button class="btn btn-ghost" id="homeBtn" type="button">回到首页</button>
    </div>
  </div>

  <!-- 暂停界面 -->
  <div class="overlay hidden" id="pauseScreen">
    <div class="panel compact">
      <div class="pause-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16" rx="1" />
          <rect x="14" y="4" width="4" height="16" rx="1" />
        </svg>
      </div>
      <h2 class="panel-title">暂停中</h2>
      <p class="subtitle">小鸡们在原地等你</p>
      <button class="btn btn-primary" id="resumeBtn" type="button">继续游戏</button>
      <button class="btn btn-ghost" id="restartBtn" type="button">重新开始</button>
    </div>
  </div>
</div>

<script src="js/sfx.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
</body>
</html>
